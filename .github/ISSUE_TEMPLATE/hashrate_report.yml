name: Hashrate report
description: Tell me how LodeMiner runs on your card. Reports from cards other than the RTX 5080 help the most.
labels: [hashrate]
body:
  - type: markdown
    attributes:
      value: |
        Let it mine for about 5 minutes first, so the card is warm and the numbers have settled. Please remove your wallet address or email from the lines you paste.
  - type: input
    id: version
    attributes:
      label: LodeMiner version
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU model and NVIDIA driver version
      placeholder: RTX 3060 Ti, driver 610.88
    validations:
      required: true
  - type: input
    id: settings
    attributes:
      label: Power limit / overclock, if you changed anything
      placeholder: stock
  - type: textarea
    id: status
    attributes:
      label: The status after about 5 minutes
      description: Press s and paste the status panel, or paste the "GPU0 ..." and "Total ..." lines from the log file.
      render: text
    validations:
      required: true
  - type: textarea
    id: startup
    attributes:
      label: The startup lines
      description: The start-up card, or the first lines of the log file down to "connected to ...".
      render: text
  - type: textarea
    id: other
    attributes:
      label: Anything else
      description: Other miners you've compared with on the same card, temperatures, anything odd.
